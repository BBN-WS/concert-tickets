<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>คอนเสิร์ต — TicketBox</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div id="nav-root"></div>
  <main class="container">
    <div id="detail-root">
      <p class="muted">กำลังโหลด...</p>
    </div>
    <div id="seat-root" class="seat-layout hidden"></div>
  </main>
  <footer>© 2026 TicketBox</footer>

  <script type="module">
    import { supabase, formatTHB, formatThaiDate, newId, getSessionUser } from "./assets/supabase.js";
    import { renderNavbar } from "./assets/navbar.js";
    renderNavbar();

    const concertId = new URLSearchParams(location.search).get("id");
    if (!concertId) {
      document.getElementById("detail-root").innerHTML = `<p class="error">ไม่พบคอนเสิร์ต</p>`;
      throw new Error("no id");
    }

    let concert, zones, bookedSet, selected = [], activeZoneId;

    async function load() {
      const [{ data: c, error: cErr }, { data: zs, error: zErr }] = await Promise.all([
        supabase.from("Concert").select("*").eq("id", concertId).maybeSingle(),
        supabase.from("Zone").select("*").eq("concertId", concertId),
      ]);
      if (cErr || !c) {
        document.getElementById("detail-root").innerHTML = `<p class="error">ไม่พบคอนเสิร์ต</p>`;
        return;
      }
      if (zErr) console.error(zErr);
      concert = c;
      zones = zs ?? [];
      activeZoneId = zones[0]?.id;

      // get booked seats for all zones at once
      const zoneIds = zones.map((z) => z.id);
      const { data: seats } = zoneIds.length ? await supabase
        .from("BookedSeat")
        .select('zoneId,"row","number"')
        .in("zoneId", zoneIds) : { data: [] };
      bookedSet = new Map();
      for (const z of zones) bookedSet.set(z.id, new Set());
      for (const s of (seats ?? [])) {
        bookedSet.get(s.zoneId)?.add(`${s.row}-${s.number}`);
      }
      renderDetail();
      renderSeats();
    }

    function renderDetail() {
      const prices = zones.map((z) => z.price);
      const min = Math.min(...prices), max = Math.max(...prices);
      document.getElementById("detail-root").innerHTML = `
        <div class="detail-grid">
          <div class="detail-img"><img src="${escapeAttr(concert.imageUrl)}" alt="${escapeAttr(concert.title)}" /></div>
          <div class="detail-info">
            <p class="artist">${escapeHtml(concert.artist)}</p>
            <h1>${escapeHtml(concert.title)}</h1>
            <div class="meta-row">
              <span class="k">วันที่</span><span>${escapeHtml(formatThaiDate(concert.date))}</span>
              <span class="k">สถานที่</span><span>${escapeHtml(concert.venue)}</span>
              <span class="k">ราคา</span><span>${formatTHB(min)} — ${formatTHB(max)}</span>
            </div>
            <p class="desc">${escapeHtml(concert.description)}</p>
          </div>
        </div>
      `;
      document.getElementById("seat-root").classList.remove("hidden");
    }

    function renderSeats() {
      const activeZone = zones.find((z) => z.id === activeZoneId);
      document.getElementById("seat-root").innerHTML = `
        <div class="seat-panel">
          <div class="zone-tabs">
            ${zones.map((z) => `
              <button class="zone-tab ${z.id === activeZoneId ? "active" : ""}" data-zone="${z.id}">
                ${escapeHtml(z.name)} · ${formatTHB(z.price)}
              </button>
            `).join("")}
          </div>
          <div class="stage">STAGE / เวที</div>
          <div id="seat-grid">${renderSeatGrid(activeZone)}</div>
          <div class="legend">
            <span><span class="swatch free"></span>ว่าง</span>
            <span><span class="swatch sel"></span>เลือก</span>
            <span><span class="swatch taken"></span>ถูกจองแล้ว</span>
          </div>
        </div>
        <aside class="summary">
          <h3>ที่นั่งที่เลือก (<span id="sel-count">0</span>)</h3>
          <ul id="sel-list"><li class="muted" style="display:block">ยังไม่มีที่นั่งที่เลือก (สูงสุด 6)</li></ul>
          <div class="total"><span>รวม</span><b id="sel-total">${formatTHB(0)}</b></div>
          <p id="seat-error" class="error hidden"></p>
          <button id="checkout-btn" class="btn btn-primary" style="width:100%; padding:10px; margin-top:10px" disabled>
            ดำเนินการชำระเงิน
          </button>
        </aside>
      `;
      document.querySelectorAll(".zone-tab").forEach((b) => {
        b.addEventListener("click", () => { activeZoneId = b.dataset.zone; renderSeats(); });
      });
      document.querySelectorAll(".seat").forEach((s) => {
        s.addEventListener("click", () => toggleSeat(s.dataset.zone, +s.dataset.row, +s.dataset.num));
      });
      document.getElementById("checkout-btn").addEventListener("click", onCheckout);
      updateSummary();
    }

    function renderSeatGrid(zone) {
      let out = "";
      const sel = new Set(selected.map((s) => `${s.zoneId}-${s.row}-${s.number}`));
      const booked = bookedSet.get(zone.id) ?? new Set();
      for (let row = 1; row <= zone.rows; row++) {
        out += `<div class="row"><span class="row-label">${row}</span><div class="row-seats">`;
        for (let n = 1; n <= zone.seatsPerRow; n++) {
          const isBooked = booked.has(`${row}-${n}`);
          const isSel = sel.has(`${zone.id}-${row}-${n}`);
          const cls = isBooked ? "seat booked" : isSel ? "seat selected" : "seat";
          out += `<button type="button" class="${cls}" data-zone="${zone.id}" data-row="${row}" data-num="${n}" ${isBooked ? "disabled" : ""} title="แถว ${row} ที่ ${n}">${n}</button>`;
        }
        out += `</div></div>`;
      }
      return out;
    }

    function toggleSeat(zoneId, row, number) {
      const key = `${zoneId}-${row}-${number}`;
      const idx = selected.findIndex((s) => `${s.zoneId}-${s.row}-${s.number}` === key);
      if (idx >= 0) selected.splice(idx, 1);
      else if (selected.length < 6) selected.push({ zoneId, row, number });
      renderSeats();
    }

    function updateSummary() {
      const list = document.getElementById("sel-list");
      const count = document.getElementById("sel-count");
      const totalEl = document.getElementById("sel-total");
      const btn = document.getElementById("checkout-btn");
      count.textContent = selected.length;
      if (selected.length === 0) {
        list.innerHTML = `<li class="muted" style="display:block">ยังไม่มีที่นั่งที่เลือก (สูงสุด 6)</li>`;
        totalEl.textContent = formatTHB(0);
        btn.disabled = true;
        return;
      }
      let total = 0;
      list.innerHTML = selected.map((s) => {
        const z = zones.find((zz) => zz.id === s.zoneId);
        total += z.price;
        return `<li><span><span class="zone-name">${escapeHtml(z.name)}</span> · แถว ${s.row} ที่ ${s.number}</span><span style="color:#a3a3a3">${formatTHB(z.price)}</span></li>`;
      }).join("");
      totalEl.textContent = formatTHB(total);
      btn.disabled = false;
    }

    async function onCheckout() {
      const errEl = document.getElementById("seat-error");
      errEl.classList.add("hidden");
      const user = await getSessionUser();
      if (!user) {
        location.href = `login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
        return;
      }
      const btn = document.getElementById("checkout-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>กำลังจอง...';

      const total = selected.reduce((sum, s) => sum + zones.find((z) => z.id === s.zoneId).price, 0);
      const bookingId = newId("bk");

      const { error: bErr } = await supabase.from("Booking").insert({
        id: bookingId,
        user_id: user.id,
        concertId: concert.id,
        totalAmount: total,
      });
      if (bErr) {
        errEl.textContent = "สร้างการจองล้มเหลว: " + bErr.message;
        errEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "ดำเนินการชำระเงิน";
        return;
      }

      const seatRows = selected.map((s) => ({
        id: newId("seat"),
        bookingId,
        zoneId: s.zoneId,
        row: s.row,
        number: s.number,
      }));
      const { error: sErr } = await supabase.from("BookedSeat").insert(seatRows);
      if (sErr) {
        // unique violation likely — roll back booking
        await supabase.from("Booking").delete().eq("id", bookingId);
        errEl.textContent = sErr.code === "23505"
          ? "ที่นั่งบางตัวถูกจองไปแล้ว กรุณาเลือกใหม่"
          : "บันทึกที่นั่งล้มเหลว: " + sErr.message;
        errEl.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "ดำเนินการชำระเงิน";
        return;
      }
      location.href = `checkout.html?id=${encodeURIComponent(bookingId)}`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    load();
  </script>
</body>
</html>
