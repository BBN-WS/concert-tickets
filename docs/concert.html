<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>คอนเสิร์ต — TicketBox</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div id="nav-root"></div>
  <main class="container">
    <div id="detail-root"><p class="muted">กำลังโหลด...</p></div>
    <div id="seat-root" class="seat-layout hidden"></div>
  </main>
  <footer>© 2026 TicketBox</footer>

  <script type="module">
    import { supabase, formatTHB, formatThaiDate, newId, getSessionUser } from "./assets/supabase.js";
    import { renderNavbar } from "./assets/navbar.js";
    import { renderVenueMap, detectVenueType } from "./assets/venue-map.js";
    renderNavbar();

    const ICONS = {
      cal: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
      pin: '<svg class="icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
      tag: '<svg class="icon" viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><path d="M7 7h.01"/></svg>',
    };

    const concertId = new URLSearchParams(location.search).get("id");
    if (!concertId) {
      document.getElementById("detail-root").innerHTML = `<p class="error">ไม่พบคอนเสิร์ต</p>`;
      throw new Error("no id");
    }

    let concert, zones, bookedSet, selected = [], activeZoneId = null;

    async function load() {
      const [{ data: c }, { data: zs }] = await Promise.all([
        supabase.from("Concert").select("*").eq("id", concertId).maybeSingle(),
        supabase.from("Zone").select("*").eq("concertId", concertId),
      ]);
      if (!c) {
        document.getElementById("detail-root").innerHTML = `<p class="error">ไม่พบคอนเสิร์ต</p>`;
        return;
      }
      concert = c;
      zones = zs ?? [];

      const zoneIds = zones.map((z) => z.id);
      const { data: seats } = zoneIds.length ? await supabase
        .from("BookedSeat").select('zoneId,"row","number"').in("zoneId", zoneIds) : { data: [] };
      bookedSet = new Map();
      for (const z of zones) bookedSet.set(z.id, new Set());
      for (const s of (seats ?? [])) bookedSet.get(s.zoneId)?.add(`${s.row}-${s.number}`);

      renderDetail();
      renderSeatPanel();
    }

    function renderDetail() {
      const prices = zones.map((z) => z.price);
      const min = Math.min(...prices), max = Math.max(...prices);
      document.getElementById("detail-root").innerHTML = `
        <div class="detail-grid">
          <div class="detail-img"><img src="${escapeAttr(concert.imageUrl)}" alt="${escapeAttr(concert.title)}" /></div>
          <div class="detail-info">
            <p class="artist">${escapeHtml(concert.artist)}</p>
            <h1>${escapeHtml(concert.title)}</h1>
            <div class="meta-row">
              <span class="k">${ICONS.cal} วันที่</span><span>${escapeHtml(formatThaiDate(concert.date))}</span>
              <span class="k">${ICONS.pin} สถานที่</span><span>${escapeHtml(concert.venue)}</span>
              <span class="k">${ICONS.tag} ราคา</span><span>${formatTHB(min)} — ${formatTHB(max)}</span>
            </div>
            <p class="desc">${escapeHtml(concert.description)}</p>
          </div>
        </div>
      `;
      document.getElementById("seat-root").classList.remove("hidden");
    }

    function renderSeatPanel() {
      const root = document.getElementById("seat-root");
      root.innerHTML = `
        <div class="seat-panel">
          <div class="venue-tabs">
            <span style="color: var(--text-muted); font-size: 13px; padding: 8px 4px;">
              ${escapeHtml(concert.venue)}
            </span>
            ${activeZoneId ? `
              <button class="venue-tab" id="back-to-map" style="margin-left:auto;">
                ← ดูแผนผัง
              </button>
            ` : ""}
          </div>
          <div id="venue-or-seats"></div>
        </div>
        <aside class="summary">
          <h3>ที่นั่งที่เลือก <span class="count" id="sel-count">0</span></h3>
          <div id="sel-body"></div>
          <p id="seat-error" class="error hidden"></p>
          <button id="checkout-btn" class="btn btn-primary btn-full btn-lg" disabled>
            ดำเนินการชำระเงิน
          </button>
        </aside>
      `;
      if (activeZoneId) {
        document.getElementById("back-to-map").addEventListener("click", () => {
          activeZoneId = null;
          renderSeatPanel();
        });
      }
      document.getElementById("checkout-btn").addEventListener("click", onCheckout);

      if (!activeZoneId) {
        renderVenueMap({
          container: document.getElementById("venue-or-seats"),
          venueType: detectVenueType(concert.venue),
          zones,
          activeZoneId,
          onZoneClick: (id) => { activeZoneId = id; renderSeatPanel(); },
          formatPrice: formatTHB,
        });
      } else {
        renderSeatGrid();
      }
      updateSummary();
    }

    function renderSeatGrid() {
      const zone = zones.find((z) => z.id === activeZoneId);
      const sel = new Set(selected.map((s) => `${s.zoneId}-${s.row}-${s.number}`));
      const booked = bookedSet.get(zone.id) ?? new Set();
      let rowsHtml = "";
      for (let row = 1; row <= zone.rows; row++) {
        let seatsHtml = "";
        for (let n = 1; n <= zone.seatsPerRow; n++) {
          const isBooked = booked.has(`${row}-${n}`);
          const isSel = sel.has(`${zone.id}-${row}-${n}`);
          const cls = isBooked ? "seat booked" : isSel ? "seat selected" : "seat";
          seatsHtml += `<button type="button" class="${cls}" data-row="${row}" data-num="${n}"
            ${isBooked ? "disabled" : ""} title="แถว ${row} ที่ ${n}">${n}</button>`;
        }
        rowsHtml += `<div class="seat-row"><span class="row-label">${row}</span><div class="row-seats">${seatsHtml}</div></div>`;
      }
      document.getElementById("venue-or-seats").innerHTML = `
        <div class="seat-grid-wrap">
          <div class="seat-grid-header">
            <h3>${escapeHtml(zone.name)}<span class="price">${formatTHB(zone.price)}</span></h3>
            <span class="muted">${zone.rows} แถว · ${zone.seatsPerRow} ที่นั่ง/แถว</span>
          </div>
          <div class="stage-bar">STAGE · เวที</div>
          <div class="seat-rows">${rowsHtml}</div>
          <div class="legend">
            <span><span class="swatch free"></span>ว่าง</span>
            <span><span class="swatch sel"></span>เลือก</span>
            <span><span class="swatch taken"></span>ถูกจองแล้ว</span>
          </div>
        </div>
      `;
      document.querySelectorAll(".seat").forEach((s) => {
        s.addEventListener("click", () => toggleSeat(zone.id, +s.dataset.row, +s.dataset.num));
      });
    }

    function toggleSeat(zoneId, row, number) {
      const key = `${zoneId}-${row}-${number}`;
      const idx = selected.findIndex((s) => `${s.zoneId}-${s.row}-${s.number}` === key);
      if (idx >= 0) selected.splice(idx, 1);
      else if (selected.length < 6) selected.push({ zoneId, row, number });
      renderSeatGrid();
      updateSummary();
    }

    function updateSummary() {
      const count = document.getElementById("sel-count");
      const body = document.getElementById("sel-body");
      const btn = document.getElementById("checkout-btn");
      count.textContent = selected.length;
      if (selected.length === 0) {
        body.innerHTML = `
          <div class="empty">เลือกที่นั่งจากแผนผังด้านซ้าย<br/>(สูงสุด 6 ที่นั่ง)</div>
          <div class="total"><span>รวม</span><b>${formatTHB(0)}</b></div>
        `;
        btn.disabled = true;
        return;
      }
      let total = 0;
      const items = selected.map((s) => {
        const z = zones.find((zz) => zz.id === s.zoneId);
        total += z.price;
        return `<li>
          <span><span class="zone-name">${escapeHtml(z.name)}</span><br/><span class="muted" style="font-size:12px">แถว ${s.row} ที่ ${s.number}</span></span>
          <span style="color: var(--text-soft)">${formatTHB(z.price)}</span>
        </li>`;
      }).join("");
      body.innerHTML = `
        <ul>${items}</ul>
        <div class="total"><span>รวม</span><b>${formatTHB(total)}</b></div>
      `;
      btn.disabled = false;
    }

    async function onCheckout() {
      const errEl = document.getElementById("seat-error");
      errEl.classList.add("hidden");
      const user = await getSessionUser();
      if (!user) {
        location.href = `login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
        return;
      }
      const btn = document.getElementById("checkout-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> กำลังจอง...';

      const total = selected.reduce((sum, s) => sum + zones.find((z) => z.id === s.zoneId).price, 0);
      const bookingId = newId("bk");

      const { error: bErr } = await supabase.from("Booking").insert({
        id: bookingId, user_id: user.id, concertId: concert.id, totalAmount: total,
      });
      if (bErr) {
        errEl.textContent = "สร้างการจองล้มเหลว: " + bErr.message;
        errEl.classList.remove("hidden");
        btn.disabled = false; btn.textContent = "ดำเนินการชำระเงิน";
        return;
      }
      const seatRows = selected.map((s) => ({
        id: newId("seat"), bookingId, zoneId: s.zoneId, row: s.row, number: s.number,
      }));
      const { error: sErr } = await supabase.from("BookedSeat").insert(seatRows);
      if (sErr) {
        await supabase.from("Booking").delete().eq("id", bookingId);
        errEl.textContent = sErr.code === "23505"
          ? "ที่นั่งบางตัวถูกจองไปแล้ว กรุณาเลือกใหม่"
          : "บันทึกที่นั่งล้มเหลว: " + sErr.message;
        errEl.classList.remove("hidden");
        btn.disabled = false; btn.textContent = "ดำเนินการชำระเงิน";
        return;
      }
      location.href = `checkout.html?id=${encodeURIComponent(bookingId)}`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    load();
  </script>
</body>
</html>
