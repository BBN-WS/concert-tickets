<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicketBox — จองบัตรคอนเสิร์ต</title>
  <meta name="description" content="จองบัตรคอนเสิร์ตออนไลน์ เลือกที่นั่งจากแผนผังสนามจริง รับ QR e-ticket ทันที" />
  <meta property="og:title" content="TicketBox — จองบัตรคอนเสิร์ต" />
  <meta property="og:description" content="เลือกที่นั่งจากแผนผังสนามจริง ชำระเงิน รับ QR e-ticket" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d946ef'/%3E%3Crect x='9' y='14' width='14' height='2' fill='white'/%3E%3Crect x='9' y='10' width='14' height='2' fill='white'/%3E%3Crect x='9' y='18' width='14' height='2' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div id="nav-root"></div>
  <main class="container">
    <section class="hero">
      <span class="hero-eyebrow"><span class="dot"></span> Tour 2026 · ขายแล้ววันนี้</span>
      <h1>จองบัตร<span class="accent">คอนเสิร์ต</span><br/>โปรดของคุณ</h1>
      <p>เลือกที่นั่งจากแผนผังสนามจริง ชำระเงินผ่านระบบจำลอง รับ QR e-ticket ทันทีที่จบ</p>
    </section>

    <h2>คอนเสิร์ตที่กำลังจะมาถึง</h2>
    <div id="concert-list" class="grid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>
  <footer>© 2026 TicketBox — สาธิตการจองบัตรคอนเสิร์ต</footer>

  <script type="module">
    import { supabase, formatTHB, formatThaiDate } from "./assets/supabase.js";
    import { renderNavbar } from "./assets/navbar.js";
    renderNavbar();

    const ICONS = {
      cal: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
      pin: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>',
    };

    async function loadConcerts() {
      const list = document.getElementById("concert-list");
      const { data: concerts, error } = await supabase
        .from("Concert")
        .select("id,title,artist,venue,date,description,imageUrl,Zone(price)")
        .order("date", { ascending: true });

      if (error) {
        list.innerHTML = `<p class="error">โหลดล้มเหลว: ${error.message}</p>`;
        return;
      }
      if (!concerts || concerts.length === 0) {
        list.innerHTML = `<p class="muted">ยังไม่มีคอนเสิร์ตในระบบ</p>`;
        return;
      }
      list.innerHTML = concerts.map((c) => {
        const minPrice = Math.min(...c.Zone.map((z) => z.price));
        return `
          <a class="card" href="concert.html?id=${encodeURIComponent(c.id)}">
            <div class="card-img"><img src="${escapeAttr(c.imageUrl)}" alt="${escapeAttr(c.title)}" loading="lazy" /></div>
            <div class="card-body">
              <p class="card-artist">${escapeHtml(c.artist)}</p>
              <h3 class="card-title">${escapeHtml(c.title)}</h3>
              <p class="card-meta">${ICONS.cal} ${escapeHtml(formatThaiDate(c.date))}</p>
              <p class="card-meta">${ICONS.pin} ${escapeHtml(c.venue)}</p>
              <p class="card-price">เริ่มต้น <b>${formatTHB(minPrice)}</b></p>
            </div>
          </a>
        `;
      }).join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    loadConcerts();
  </script>
</body>
</html>
