<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>เข้าสู่ระบบ — TicketBox</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d946ef'/%3E%3Crect x='9' y='14' width='14' height='2' fill='white'/%3E%3Crect x='9' y='10' width='14' height='2' fill='white'/%3E%3Crect x='9' y='18' width='14' height='2' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div id="nav-root"></div>
  <main class="container">
    <div class="auth-split">
      <aside class="auth-aside">
        <a href="index.html" class="brand"><span class="brand-mark"></span>
          Ticket<span style="background:linear-gradient(135deg,var(--accent),var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent;">Box</span>
        </a>
        <div>
          <h2>ยินดีต้อนรับกลับ</h2>
          <p>เข้าสู่ระบบเพื่อจองที่นั่ง ดูบัตร และรับ QR e-ticket ของคุณ</p>
          <div style="margin-top:20px">
            <div class="feature"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> เลือกที่นั่งจากแผนผังสนามจริง</div>
            <div class="feature"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> QR e-ticket ทันทีหลังชำระเงิน</div>
            <div class="feature"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> จัดการบัตรทั้งหมดในที่เดียว</div>
          </div>
        </div>
        <p class="muted" style="font-size:12px">© 2026 TicketBox</p>
      </aside>

      <div class="auth-form">
        <h1>เข้าสู่ระบบ</h1>
        <p class="subtitle">กรอกอีเมลและรหัสผ่านของคุณ</p>
        <form id="login-form">
          <div class="field">
            <label for="email">อีเมล</label>
            <input id="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">รหัสผ่าน</label>
            <input id="password" type="password" required autocomplete="current-password" />
          </div>
          <p id="error" class="error hidden"></p>
          <button class="btn btn-primary btn-full btn-lg" type="submit" id="submit-btn">เข้าสู่ระบบ</button>
        </form>
        <p class="muted" style="margin-top:16px">
          ยังไม่มีบัญชี? <a href="register.html" style="color:var(--accent)">สมัครสมาชิก</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase } from "./assets/supabase.js";
    import { renderNavbar } from "./assets/navbar.js";
    renderNavbar();

    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "index.html";
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> กำลังเข้าสู่ระบบ...';
      const { error } = await supabase.auth.signInWithPassword({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      });
      submitBtn.disabled = false;
      submitBtn.textContent = "เข้าสู่ระบบ";
      if (error) {
        errorEl.textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
        errorEl.classList.remove("hidden");
        return;
      }
      location.href = next;
    });
  </script>
</body>
</html>
